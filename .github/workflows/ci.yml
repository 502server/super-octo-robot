name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check JavaScript syntax
        run: |
          node --check api/server.js
          node --check api/store.js
          node --check api/access.js
          node --check api/security.js
          node --check api/integrations.js
          node --check api/intelligence.js
          node --check scripts/preflight-json-import.js
          node --check scripts/import-json-to-postgres.js
          node --check web/app.js

      - name: Run tests
        run: npm test

      - name: Build production container
        run: docker build --tag fivezero2-group:ci .
