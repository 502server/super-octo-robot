name: Fly.io deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flyio-production-deploy
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    env:
      FLY_APP: fivezero2-group-7777
      FLY_REGION: iad
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint frontend and backend
        run: pnpm lint

      - name: Check TypeScript
        run: pnpm typecheck

      - name: Build frontend
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Check deployment secrets
        id: deploy-gate
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          BOOTSTRAP_TOKEN: ${{ secrets.BOOTSTRAP_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${FLY_API_TOKEN:-}" ]] || missing+=(FLY_API_TOKEN)
          [[ -n "${DATABASE_URL:-}" ]] || missing+=(DATABASE_URL)
          [[ ${#SESSION_SECRET} -ge 32 ]] || missing+=(SESSION_SECRET)
          [[ ${#BOOTSTRAP_TOKEN} -ge 24 ]] || missing+=(BOOTSTRAP_TOKEN)
          if (( ${#missing[@]} )); then
            echo "::error::Missing or invalid GitHub Actions secrets: ${missing[*]}"
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Install flyctl
        if: steps.deploy-gate.outputs.ready == 'true'
        uses: superfly/flyctl-actions/setup-flyctl@v1.5
        with:
          version: "0.5.5"

      - name: Ensure persistent volume for one-time JSON import
        if: steps.deploy-gate.outputs.ready == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          existing="$(flyctl volumes list --app "$FLY_APP" | grep -c 'app_data' || true)"
          if (( existing == 0 )); then
            flyctl volumes create app_data --app "$FLY_APP" --region "$FLY_REGION" --size 1 --yes
          fi

      - name: Stage application secrets
        if: steps.deploy-gate.outputs.ready == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          BOOTSTRAP_TOKEN: ${{ secrets.BOOTSTRAP_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          flyctl secrets set --app "$FLY_APP" --stage             "DATABASE_URL=$DATABASE_URL"             "SESSION_SECRET=$SESSION_SECRET"             "BOOTSTRAP_TOKEN=$BOOTSTRAP_TOKEN"

      - name: Deploy to Fly.io
        if: steps.deploy-gate.outputs.ready == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --app "$FLY_APP"
