# fly.toml app configuration file generated for fivezero2-group-7777 on 2026-11-18T07:23:05Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'fivezero2-group-7777'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  DATA_FILE = '/app/data/state.json'
  HOST = '0.0.0.0'
  NODE_ENV = 'production'
  PORT = '3000'
  TRUST_PROXY = '1'

[[mounts]]
  source = 'app_data'
  destination = '/app/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/api/health'

[[restart]]
  policy = 'always'
  retries = 10
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
